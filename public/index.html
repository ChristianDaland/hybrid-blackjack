<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Bord - Løland Gård</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #059669;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #064e3b;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .qr-box {
      background: white;
      color: #064e3b;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qr-box img {
      width: 60px;
      height: 60px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px;
    }
    .dealer-area { text-align: center; font-size: 1.5rem; font-weight: bold; }
    .players-area { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; width: 100%; }
    .player-card {
      background-color: #065f46;
      border: 2px solid #34d399;
      border-radius: 12px;
      padding: 20px;
      width: 240px;
      text-align: center;
      position: relative;
    }
    .active-turn { border-color: #facc15; box-shadow: 0 0 15px #facc15; }
    .player-chips {
      color: #34d399;
      font-weight: bold;
      font-size: 0.95rem;
      margin-top: 4px;
      margin-bottom: 8px;
    }
    .status-badge {
      display: inline-block;
      background: #facc15;
      color: black;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .result-badge {
      background: #ef4444;
      color: white;
      font-size: 1rem;
      padding: 6px 12px;
      border-radius: 6px;
      margin-top: 8px;
      font-weight: bold;
    }
    .win-badge { background: #10b981; }
    .controls-bar {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-start { background-color: #2563eb; color: white; }
    .btn-reset { background-color: #64748b; color: white; }
    .cards { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .card-small {
      background: white; color: black; width: 42px; height: 60px;
      border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.1rem;
    }
    .red { color: #dc2626; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="font-size: 1.8rem;">BLACKJACK</h1>
      <p style="opacity: 0.8;">Bordskjerm (Banken)</p>
    </div>
    <div class="qr-box">
      <div>
        SKANN FOR Å BLI MED:<br>
        <span style="font-size: 0.75rem; font-weight: normal;">hybrid-blackjack.onrender.com/mobile</span>
      </div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://hybrid-blackjack.onrender.com/mobile" alt="QR-kode">
    </div>
  </header>

  <main>
    <div class="dealer-area">
      <h2>BANKEN (DEALER) — POENG: <span id="dealer-score">0</span></h2>
      <div id="dealer-cards" class="cards"></div>
    </div>

    <div id="players-list" class="players-area"></div>

    <div class="controls-bar">
      <button class="btn-start" onclick="startNewHand()">Start Ny Hånd</button>
      <button class="btn-reset" onclick="resetGame()">Nullstill Bord</button>
    </div>
  </main>

  <script>
    const socket = io();

    function startNewHand() {
      socket.emit('start_new_hand');
    }

    function resetGame() {
      socket.emit('reset_game');
    }

    socket.on('game_state', (data) => {
      document.getElementById('dealer-score').innerText = data.dealerScore || 0;

      const dealerCards = document.getElementById('dealer-cards');
      dealerCards.innerHTML = '';
      if (data.dealerHand) {
        data.dealerHand.forEach(card => {
          const isRed = card.suit === '♥' || card.suit === '♦';
          const div = document.createElement('div');
          div.className = `card-small ${isRed ? 'red' : ''}`;
          div.innerText = `${card.value}${card.suit}`;
          dealerCards.appendChild(div);
        });
      }

      const playersList = document.getElementById('players-list');
      playersList.innerHTML = '';

      data.players.forEach(p => {
        const card = document.createElement('div');
        card.className = `player-card ${p.isCurrentTurn ? 'active-turn' : ''}`;
        
        let statusText = p.hasBet ? `Bud: ${p.bet} kr` : 'Venter på bud...';

        let resultHTML = '';
        if (p.resultText) {
          const isWin = p.resultText.includes('VANT');
          resultHTML = `<div class="result-badge ${isWin ? 'win-badge' : ''}">${p.resultText}</div>`;
        }

        let cardsHTML = '';
        if (p.hand && p.hand.length > 0) {
          cardsHTML = p.hand.map(c => {
            const isRed = c.suit === '♥' || c.suit === '♦';
            return `<div class="card-small ${isRed ? 'red' : ''}">${c.value}${c.suit}</div>`;
          }).join('');
        }

        card.innerHTML = `
          <h3>${p.name}</h3>
          <div class="player-chips">Saldo: ${p.chips} kr</div>
          <div class="status-badge">${statusText}</div>
          <div class="cards">${cardsHTML}</div>
          <p style="margin-top: 10px;">Poeng: ${p.score}</p>
          ${resultHTML}
        `;
        playersList.appendChild(card);
      });
    });
  </script>
</body>
</html>
