<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Mobil Spiller</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card-panel {
      width: 100%;
      max-width: 360px;
      background-color: #1e293b;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
      font-size: 1.1rem;
      margin-bottom: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-join { background-color: #2563eb; color: white; }
    .btn-hit { background-color: #16a34a; color: white; }
    .btn-stand { background-color: #dc2626; color: white; }
    
    .badge {
      background-color: #eab308;
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 15px;
    }
    
    .cards-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
      flex-wrap: wrap;
      min-height: 110px;
    }
    .card {
      background: white;
      color: #0f172a;
      width: 70px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      font-weight: bold;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .red { color: #dc2626; }
    .controls { display: flex; gap: 10px; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- Innlogging -->
  <div id="login-view" class="card-panel">
    <h2 style="margin-bottom: 15px;">Bli med i spillet</h2>
    <input type="text" id="player-name" placeholder="Skriv navnet ditt">
    <button class="btn-join" onclick="joinGame()">Bli med</button>
  </div>

  <!-- Spillskjerm -->
  <div id="game-view" class="card-panel" style="display: none;">
    <h2 id="display-name" style="margin-bottom: 10px;">Spiller</h2>
    <div id="turn-badge" class="badge" style="display: none;">Din Tur!</div>

    <div id="my-cards" class="cards-container"></div>
    <h3 id="hand-score">Håndverdi: 0</h3>

    <div id="controls" class="controls" style="display: none;">
      <button class="btn-hit" onclick="hit()">Trekk (Hit)</button>
      <button class="btn-stand" onclick="stand()">Stå (Stand)</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myPlayerName = '';

    function joinGame() {
      const name = document.getElementById('player-name').value.trim();
      if (name) {
        myPlayerName = name;
        socket.emit('join_game', { name });
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';
        document.getElementById('display-name').innerText = name;
      }
    }

    function hit() { socket.emit('player_hit'); }
    function stand() { socket.emit('player_stand'); }

    function updateUI(hand, score, isTurn, gameStatus) {
      const cardsContainer = document.getElementById('my-cards');
      cardsContainer.innerHTML = '';

      if (hand && hand.length > 0) {
        hand.forEach(card => {
          const isRed = card.suit === '♥' || card.suit === '♦';
          const cardDiv = document.createElement('div');
          cardDiv.className = `card ${isRed ? 'red' : ''}`;
          cardDiv.innerHTML = `<div>${card.value}</div><div style="text-align:right;">${card.suit}</div>`;
          cardsContainer.appendChild(cardDiv);
        });
      }

      document.getElementById('hand-score').innerText = `Håndverdi: ${score || 0}`;

      const turnBadge = document.getElementById('turn-badge');
      const controls = document.getElementById('controls');

      if (isTurn && (gameStatus === 'PLAYING' || !gameStatus)) {
        turnBadge.style.display = 'inline-block';
        controls.style.display = 'flex';
      } else {
        turnBadge.style.display = 'none';
        controls.style.display = 'none';
      }
    }

    // 1. Direkte oppdatering for min spiller fra serveren
    socket.on('player_state', (data) => {
      updateUI(data.hand, data.score, data.myTurn, data.gameStatus);
    });

    // 2. Fellesoppdatering hvis player_state forsinkes
    socket.on('game_state', (data) => {
      const me = data.players.find(p => p.id === socket.id || p.name === myPlayerName);
      if (me) {
        updateUI(me.hand, me.score, me.isCurrentTurn, data.gameStatus);
      }
    });
  </script>
</body>
</html>
