<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Bord - Løland Gård</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #059669;
      color: white;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #064e3b;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .qr-box {
      background: white;
      color: #064e3b;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .qr-box img {
      width: 48px;
      height: 48px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      overflow: hidden;
    }
    .dealer-area { text-align: center; font-size: 1.3rem; font-weight: bold; }
    .players-area { 
      display: flex; 
      gap: 15px; 
      justify-content: center; 
      align-items: center;
      flex-wrap: wrap; 
      width: 100%; 
      flex: 1;
    }
    .player-card {
      background-color: #065f46;
      border: 2px solid #34d399;
      border-radius: 12px;
      padding: 12px;
      width: 200px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .player-card.eliminated {
      border-color: #ef4444;
      opacity: 0.75;
    }
    .eliminated-cross {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ef4444;
      font-size: 4rem;
      font-weight: 900;
      z-index: 10;
      line-height: 1;
    }
    .eliminated-text {
      font-size: 1rem;
      color: #ef4444;
      font-weight: bold;
      margin-top: 4px;
      letter-spacing: 1px;
    }
    .active-turn { border-color: #facc15; box-shadow: 0 0 15px #facc15; }
    .player-chips {
      color: #34d399;
      font-weight: bold;
      font-size: 0.9rem;
      margin-top: 2px;
      margin-bottom: 6px;
    }
    .status-badge {
      display: inline-block;
      background: #facc15;
      color: black;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .result-badge {
      background: #ef4444;
      color: white;
      font-size: 0.9rem;
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 6px;
      font-weight: bold;
    }
    .win-badge { background: #10b981; }
    .controls-bar {
      display: flex;
      gap: 15px;
      margin-top: 5px;
      flex-shrink: 0;
    }
    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-start { background-color: #2563eb; color: white; }
    .btn-reset { background-color: #64748b; color: white; }
    .cards { display: flex; gap: 6px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
    .card-small {
      background: white; color: black; width: 38px; height: 54px;
      border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1rem;
    }
    .red { color: #dc2626; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="font-size: 1.5rem;">BLACKJACK</h1>
      <p style="opacity: 0.8; font-size: 0.85rem;">Bordskjerm (Banken)</p>
    </div>
    <div class="qr-box">
      <div>
        SKANN FOR Å BLI MED:<br>
        <span style="font-size: 0.7rem; font-weight: normal;">hybrid-blackjack.onrender.com/mobile</span>
      </div>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://hybrid-blackjack.onrender.com/mobile" alt="QR-kode">
    </div>
  </header>

  <main>
    <div class="dealer-area">
      <h2 style="font-size: 1.3rem;">BANKEN (DEALER) — POENG: <span id="dealer-score">0</span></h2>
      <div id="dealer-cards" class="cards"></div>
    </div>

    <div id="players-list" class="players-area"></div>

    <div class="controls-bar">
      <button class="btn-start" onclick="startNewHand()">Start Ny Hånd</button>
      <button class="btn-reset" onclick="resetGame()">Nullstill Bord</button>
    </div>
  </main>

  <script>
    const socket = io();

    function startNewHand() {
      socket.emit('start_new_hand');
    }

    function resetGame() {
      socket.emit('reset_game');
    }

    socket.on('game_state', (data) => {
      document.getElementById('dealer-score').innerText = data.dealerScore || 0;

      const dealerCards = document.getElementById('dealer-cards');
      dealerCards.innerHTML = '';
      if (data.dealerHand) {
        data.dealerHand.forEach(card => {
          const isRed = card.suit === '♥' || card.suit === '♦';
          const div = document.createElement('div');
          div.className = `card-small ${isRed ? 'red' : ''}`;
          div.innerText = `${card.value}${card.suit}`;
          dealerCards.appendChild(div);
        });
      }

      const playersList = document.getElementById('players-list');
      playersList.innerHTML = '';

      data.players.forEach(p => {
        const card = document.createElement('div');
        card.className = `player-card ${p.isCurrentTurn ? 'active-turn' : ''} ${p.isEliminated ? 'eliminated' : ''}`;
        
        let statusText = p.hasBet ? `Bud: ${p.bet} kr` : 'Venter på bud...';

        let resultHTML = '';
        if (p.resultText && !p.isEliminated) {
          const isWin = p.resultText.includes('Vant');
          resultHTML = `<div class="result-badge ${isWin ? 'win-badge' : ''}">${p.resultText}</div>`;
        }

        let cardsHTML = '';
        if (p.hand && p.hand.length > 0) {
          cardsHTML = p.hand.map(c => {
            const isRed = c.suit === '♥' || c.suit === '♦';
            return `<div class="card-small ${isRed ? 'red' : ''}">${c.value}${c.suit}</div>`;
          }).join('');
        }

        let crossHTML = '';
        if (p.isEliminated) {
          crossHTML = `
            <div class="eliminated-cross">
              ✕
              <div class="eliminated-text">SLÅTT UT</div>
            </div>
          `;
        }

        card.innerHTML = `
          ${crossHTML}
          <h3>${p.name}</h3>
          <div class="player-chips">Saldo: ${p.chips} kr</div>
          <div class="status-badge">${statusText}</div>
          <div class="cards">${cardsHTML}</div>
          <p style="margin-top: 6px; font-size: 0.9rem;">Poeng: ${p.score}</p>
          ${resultHTML}
        `;
        playersList.appendChild(card);
      });
    });
  </script>
</body>
</html>
