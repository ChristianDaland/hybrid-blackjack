<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blackjack Spiller</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card-box {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1.1rem;
      margin-bottom: 15px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-primary { background: #10b981; color: white; }
    .btn-action { background: #3b82f6; color: white; }
    .btn-stand { background: #ef4444; color: white; }
    .chips { color: #34d399; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
    .bet { color: #facc15; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; }
    .action-group { display: flex; gap: 10px; margin-top: 15px; }
    .action-group button { flex: 1; }
    .cards { display: flex; gap: 8px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
    .card-small {
      background: white; color: black; width: 50px; height: 75px;
      border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.3rem;
    }
    .red { color: #dc2626; }
    .dealer-box {
      background: #064e3b;
      border-radius: 12px;
      padding: 12px;
      margin: 15px 0;
    }
    .dealer-box .cards { margin: 8px 0 0; }
    .bet-prompt {
      color: #facc15;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 12px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .eliminated-box {
      background: #450a0a;
      border: 2px solid #ef4444;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
    }
    .eliminated-box h2 {
      color: #ef4444;
      font-size: 2rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- REGISTRERING -->
  <div id="join-screen" class="card-box">
    <h2 style="margin-bottom: 20px;">Bli med i spillet</h2>
    <input type="text" id="player-name" placeholder="Ditt navn">
    <button class="btn-primary" onclick="joinGame()">Start Spillet</button>
  </div>

  <!-- SPILLSKJERM -->
  <div id="game-screen" class="card-box" style="display: none;">
    <h2 id="display-name">Spiller</h2>
    <div class="chips">Saldo: <span id="display-chips">500</span> kr</div>
    <div class="bet">Bud: <span id="display-bet">0</span> kr</div>

    <!-- BANKENS HÅND -->
    <div id="dealer-section" class="dealer-box" style="display: none;">
      <div style="font-weight: bold;">Banken — poeng: <span id="dealer-score">0</span></div>
      <div id="dealer-cards" class="cards"></div>
    </div>

    <!-- ELIMINERT SKJERM -->
    <div id="eliminated-section" class="eliminated-box" style="display: none;">
      <h2>DU ER UTE! ✕</h2>
      <p style="color: #fca5a5; font-size: 1.1rem;">Du har brukt opp alle pengene dine og kan ikke spille videre denne runden.</p>
    </div>

    <!-- BETTING PANEL -->
    <div id="betting-section" style="display: none;">
      <p class="bet-prompt">Plasser innsatsen din!</p>
      <input type="number" id="bet-amount" value="50" min="10" step="10">
      <button class="btn-primary" onclick="placeBet()">Sats penger</button>
    </div>

    <!-- SPILL PANEL -->
    <div id="playing-section" style="display: none;">
      <div id="cards-container" class="cards"></div>
      <p style="font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">Håndverdi: <span id="display-score">0</span></p>

      <div id="turn-actions" style="display: none;">
        <div class="action-group">
          <button class="btn-action" onclick="hit()">Trekk kort</button>
          <button class="btn-stand" onclick="stand()">Stå</button>
        </div>
      </div>
      <p id="wait-message" style="color: #94a3b8; font-style: italic; margin-top: 10px; display: none;">Venter på din tur...</p>
    </div>

    <p id="game-msg" style="margin-top: 15px; font-weight: bold; color: #facc15;"></p>
  </div>

  <script>
    const socket = io();

    function joinGame() {
      const name = document.getElementById('player-name').value.trim();
      if (!name) return alert('Vennligst skriv inn navnet ditt.');
      socket.emit('join_game', { name });
      document.getElementById('join-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      document.getElementById('display-name').innerText = name;
    }

    function placeBet() {
      const amount = document.getElementById('bet-amount').value;
      socket.emit('place_bet', { amount });
    }

    function hit() { socket.emit('player_hit'); }
    function stand() { socket.emit('player_stand'); }

    function renderCards(container, hand) {
      container.innerHTML = '';
      (hand || []).forEach(c => {
        const isRed = c.suit === '♥' || c.suit === '♦';
        const div = document.createElement('div');
        div.className = `card-small ${isRed ? 'red' : ''}`;
        div.innerText = `${c.value}${c.suit}`;
        container.appendChild(div);
      });
    }

    // Bankens hånd vises på mobilen mens runden spilles og når den er ferdig
    socket.on('game_state', (data) => {
      const dealerSec = document.getElementById('dealer-section');
      const showDealer = (data.gameStatus === 'PLAYING' || data.gameStatus === 'GAME_OVER') && data.dealerHand.length > 0;
      dealerSec.style.display = showDealer ? 'block' : 'none';
      document.getElementById('dealer-score').innerText = data.dealerScore || 0;
      renderCards(document.getElementById('dealer-cards'), data.dealerHand);
    });

    let wasAskedToBet = false;

    socket.on('player_state', (data) => {
      document.getElementById('display-chips').innerText = data.chips;
      document.getElementById('display-bet').innerText = data.bet;

      const bettingSec = document.getElementById('betting-section');
      const playingSec = document.getElementById('playing-section');
      const turnActions = document.getElementById('turn-actions');
      const waitMsg = document.getElementById('wait-message');
      const gameMsg = document.getElementById('game-msg');
      const eliminatedSec = document.getElementById('eliminated-section');

      // Hvis spilleren er slått ut (0 kr og 0 bud)
      if (data.isEliminated) {
        eliminatedSec.style.display = 'block';
        bettingSec.style.display = 'none';
        playingSec.style.display = 'none';
        gameMsg.innerText = '';
        return;
      } else {
        eliminatedSec.style.display = 'none';
      }

      if (data.gameStatus !== 'BETTING') wasAskedToBet = false;

      if (data.gameStatus === 'BETTING') {
        playingSec.style.display = 'none';
        gameMsg.innerText = '';
        if (!data.hasBet) {
          bettingSec.style.display = 'block';
          // Vibrer én gang når det er tid for å satse (fungerer på Android)
          if (!wasAskedToBet && navigator.vibrate) navigator.vibrate(200);
          wasAskedToBet = true;
        } else {
          bettingSec.style.display = 'none';
          gameMsg.innerText = 'Bud plassert! Venter på andre spillere...';
        }
      } else if (data.gameStatus === 'PLAYING' && data.bet === 0) {
        // Ble med midt i en runde
        bettingSec.style.display = 'none';
        playingSec.style.display = 'none';
        gameMsg.innerText = 'Runden er i gang – du er med fra neste runde.';
      } else if (data.gameStatus === 'PLAYING' || data.gameStatus === 'GAME_OVER') {
        bettingSec.style.display = 'none';
        playingSec.style.display = 'block';

        renderCards(document.getElementById('cards-container'), data.hand);

        document.getElementById('display-score').innerText = data.score;

        if (data.gameStatus === 'PLAYING') {
          if (data.myTurn) {
            turnActions.style.display = 'block';
            waitMsg.style.display = 'none';
            gameMsg.innerText = 'Det er din tur!';
          } else {
            turnActions.style.display = 'none';
            waitMsg.style.display = 'block';
            gameMsg.innerText = '';
          }
        } else if (data.gameStatus === 'GAME_OVER') {
          turnActions.style.display = 'none';
          waitMsg.style.display = 'none';
          gameMsg.innerText = (data.resultText || 'Runden er ferdig!') + '\nNeste runde starter straks...';
        }
      }
    });
  </script>
</body>
</html>
