<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack - Bordskjerm</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #064e3b;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      padding: 15px 25px;
      border-radius: 12px;
    }
    .dealer-area {
      text-align: center;
      margin: 20px 0;
    }
    .cards-flex {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
    }
    .card {
      background: white;
      color: black;
      width: 70px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      font-weight: bold;
      font-size: 1.3rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    .red { color: #dc2626; }
    
    .players-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .player-card {
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid transparent;
      border-radius: 16px;
      padding: 15px;
      width: 200px;
      text-align: center;
    }
    .player-card.active { border-color: #eab308; transform: scale(1.05); }
    
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .btn-start { background-color: #2563eb; color: white; }
    .btn-reset { background-color: #475569; color: white; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <h1>BLACKJACK</h1>
      <p style="color: #a7f3d0;">Bordskjerm (Banken)</p>
    </div>
    <div style="text-align: right;">
      <p style="font-size: 0.8rem; color: #a7f3d0;">SKANN FOR Å BLI MED:</p>
      <p style="font-weight: bold;">hybrid-blackjack.onrender.com/mobile</p>
    </div>
  </div>

  <!-- Dealer / Banken -->
  <div class="dealer-area">
    <h2>BANKEN (DEALER) — POENG: <span id="dealer-score">0</span></h2>
    <div id="dealer-cards" class="cards-flex"></div>
  </div>

  <!-- Spillere rundt bordet -->
  <div id="players-grid" class="players-grid"></div>

  <!-- Kontroller -->
  <div class="controls">
    <button class="btn-start" onclick="startGame()">Start Ny Runde</button>
    <button class="btn-reset" onclick="resetGame()">Nullstill Bord</button>
  </div>

  <script>
    const socket = io({ transports: ['websocket'] });

    function startGame() { socket.emit('start_game'); }
    function resetGame() { socket.emit('reset_game'); }

    socket.on('game_state', (data) => {
      // Oppdater Dealer
      document.getElementById('dealer-score').innerText = data.dealerScore;
      const dealerCardsEl = document.getElementById('dealer-cards');
      dealerCardsEl.innerHTML = '';
      data.dealerHand.forEach(card => {
        const isRed = card.suit === '♥' || card.suit === '♦';
        const div = document.createElement('div');
        div.className = `card ${isRed ? 'red' : ''}`;
        div.innerHTML = `<div>${card.value}</div><div style="text-align:right;">${card.suit}</div>`;
        dealerCardsEl.appendChild(div);
      });

      // Oppdater Spillere
      const grid = document.getElementById('players-grid');
      grid.innerHTML = '';

      data.players.forEach(p => {
        const cardEl = document.createElement('div');
        cardEl.className = `player-card ${p.isCurrentTurn ? 'active' : ''}`;
        
        let statusText = '';
        if (p.status === 'BUST') statusText = '💥 SPREKT';
        else if (p.status === 'DOUBLED') statusText = '⚡ DOBLET';
        else if (p.status === 'STAND') statusText = '✋ STÅR';
        else if (p.status === 'BETTING') statusText = '⏳ VENTER PÅ BUD';

        let cardsHtml = '';
        p.hand.forEach(c => {
          const isRed = c.suit === '♥' || c.suit === '♦';
          cardsHtml += `<span style="color:${isRed ? '#f87171' : 'white'}; font-weight:bold; margin:0 3px;">${c.value}${c.suit}</span>`;
        });

        cardEl.innerHTML = `
          <h3 style="color:#f87171;">${p.name}</h3>
          <p style="color:#eab308; font-weight:bold; margin: 4px 0;">Bud: ${p.bet || 0} kr</p>
          <div style="margin: 8px 0; font-size:1.2rem;">${cardsHtml || '-'}</div>
          <p>Poeng: <strong>${p.score}</strong></p>
          <p style="font-size: 0.85rem; margin-top: 5px; color:#a7f3d0;">${statusText}</p>
        `;
        grid.appendChild(cardEl);
      });
    });
  </script>
</body>
</html>
