<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Blackjack - Bordskjerm</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #064e3b;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
      padding: 15px 25px;
      border-radius: 12px;
    }
    .qr-box {
      background: white;
      color: #000;
      padding: 10px 15px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .qr-box img {
      width: 70px;
      height: 70px;
      border-radius: 4px;
    }
    .dealer-area {
      text-align: center;
      margin-top: 10px;
    }
    .players-area {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .player-card {
      background: rgba(0,0,0,0.3);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 15px;
      min-width: 170px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .player-card.active {
      border-color: #facc15;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.5);
      background: rgba(0,0,0,0.5);
    }
    .cards-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 10px 0;
      min-height: 90px;
    }
    .card {
      background: white;
      color: #0f172a;
      width: 55px;
      height: 80px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5px;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .red { color: #dc2626; }
    .footer-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    button {
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .btn-start { background-color: #2563eb; color: white; }
    .btn-reset { background-color: #475569; color: white; }
    
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-content {
      background: #0f172a;
      padding: 30px;
      border-radius: 20px;
      border: 2px solid #facc15;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1 style="color: #facc15;">BLACKJACK</h1>
      <p style="color: #94a3b8;">Bordskjerm (Banken)</p>
    </div>
    <div class="qr-box">
      <div style="text-align: right; font-size: 0.8rem; font-weight: bold;">
        SKANN FOR Å BLI MED:<br>
        <span id="mobile-url-text" style="color: #2563eb;"></span>
      </div>
      <img id="qr-image" src="" alt="QR Kode">
    </div>
  </header>

  <div class="dealer-area">
    <h2>BANKEN (DEALER) — POENG: <span id="dealer-score">0</span></h2>
    <div id="dealer-cards" class="cards-container"></div>
  </div>

  <div id="players-container" class="players-area"></div>

  <div class="footer-controls">
    <button class="btn-start" onclick="startGame()">Start Ny Runde</button>
    <button class="btn-reset" onclick="resetGame()">Nullstill Bord</button>
  </div>

  <div id="result-modal" class="modal">
    <div class="modal-content">
      <h2 style="color: #facc15; font-size: 2rem; margin-bottom: 15px;">RUNDEN ER FULLFØRT</h2>
      <div id="result-text" style="font-size: 1.2rem; margin-bottom: 20px;"></div>
      <button class="btn-start" onclick="startGame()">Neste Hånd</button>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket'] });

    // Sett opp QR-kode med bilde-API som tåler alt
    const mobileUrl = `${window.location.origin}/mobile`;
    document.getElementById('mobile-url-text').innerText = mobileUrl.replace('https://', '');
    document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(mobileUrl)}`;

    function startGame() {
      document.getElementById('result-modal').style.display = 'none';
      socket.emit('start_game');
    }

    function resetGame() {
      document.getElementById('result-modal').style.display = 'none';
      socket.emit('reset_game');
    }

    function renderCard(card) {
      if (card.value === '?') {
        return `<div class="card" style="background:#1e293b; color:white; justify-content:center; align-items:center;">?</div>`;
      }
      const isRed = card.suit === '♥' || card.suit === '♦';
      return `
        <div class="card ${isRed ? 'red' : ''}">
          <div>${card.value}</div>
          <div style="text-align:right;">${card.suit}</div>
        </div>
      `;
    }

    socket.on('game_state', (data) => {
      document.getElementById('dealer-score').innerText = data.dealerScore;
      const dealerContainer = document.getElementById('dealer-cards');
      dealerContainer.innerHTML = data.dealerHand.map(renderCard).join('');

      const playersContainer = document.getElementById('players-container');
      playersContainer.innerHTML = '';

      data.players.forEach(p => {
        const pDiv = document.createElement('div');
        pDiv.className = `player-card ${p.isCurrentTurn ? 'active' : ''}`;
        
        let statusBadge = '';
        if (p.status === 'BUST') statusBadge = ' <span style="color:#ef4444;">(BUST)</span>';
        else if (p.status === 'STAND') statusBadge = ' <span style="color:#3b82f6;">(Står)</span>';
        else if (p.status === 'DOUBLED') statusBadge = ' <span style="color:#eab308;">(Doblet)</span>';

        pDiv.innerHTML = `
          <h3 style="font-size: 1.2rem;">${p.name}${statusBadge}</h3>
          <p style="color: #facc15; font-size: 0.9rem; margin-top: 2px;">Bud: ${p.bet || 0} kr</p>
          <div class="cards-container">
            ${p.hand.map(renderCard).join('')}
          </div>
          <p style="font-weight: bold;">Poeng: ${p.score}</p>
        `;
        playersContainer.appendChild(pDiv);
      });

      if (data.gameStatus === 'GAME_OVER') {
        const modal = document.getElementById('result-modal');
        const resultText = document.getElementById('result-text');
        
        let resultsHTML = '';
        const dealerScore = data.dealerScore;

        data.players.forEach(p => {
          let outcome = '';
          if (p.score > 21) {
            outcome = '<span style="color:#ef4444;">Tapte (Sprakk)</span>';
          } else if (dealerScore > 21 || p.score > dealerScore) {
            outcome = '<span style="color:#22c55e;">Vant!</span>';
          } else if (p.score === dealerScore) {
            outcome = '<span style="color:#eab308;">Uavgjort (Push)</span>';
          } else {
            outcome = '<span style="color:#ef4444;">Tapte</span>';
          }
          resultsHTML += `<p style="margin-bottom:8px;"><strong>${p.name}:</strong> ${outcome} (${p.score} vs ${dealerScore})</p>`;
        });

        resultText.innerHTML = resultsHTML;
        modal.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
