<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Mobil Spiller</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card-panel {
      width: 100%;
      max-width: 360px;
      background-color: #1e293b;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
      font-size: 1.1rem;
      margin-bottom: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-join { background-color: #2563eb; color: white; }
    .btn-hit { background-color: #16a34a; color: white; }
    .btn-stand { background-color: #dc2626; color: white; }
    .btn-bet { background-color: #facc15; color: #000; font-size: 1.2rem; }
    
    .bet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .badge {
      background-color: #eab308;
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9rem;
      display: inline-block;
      margin-bottom: 15px;
    }
    
    .cards-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
      flex-wrap: wrap;
      min-height: 110px;
    }
    .card {
      background: white;
      color: #0f172a;
      width: 70px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      font-weight: bold;
      font-size: 1.3rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .red { color: #dc2626; }
    .controls { display: flex; gap: 10px; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- Innlogging -->
  <div id="login-view" class="card-panel">
    <h2 style="margin-bottom: 15px;">Bli med i spillet</h2>
    <input type="text" id="player-name" placeholder="Skriv navnet ditt">
    <button class="btn-join" onclick="joinGame()">Bli med</button>
  </div>

  <!-- Spillskjerm -->
  <div id="game-view" class="card-panel" style="display: none;">
    <h2 id="display-name" style="margin-bottom: 10px;">Spiller</h2>

    <!-- Budgiving Panel -->
    <div id="betting-panel" style="display: none;">
      <h3 style="color: #facc15; margin-bottom: 10px;">Plasser ditt bud:</h3>
      <div class="bet-grid">
        <button class="btn-bet" onclick="placeBet(10)">10 kr</button>
        <button class="btn-bet" onclick="placeBet(50)">50 kr</button>
        <button class="btn-bet" onclick="placeBet(100)">100 kr</button>
        <button class="btn-bet" onclick="placeBet(250)">250 kr</button>
      </div>
    </div>

    <!-- Vente på at andre byr -->
    <div id="waiting-bets" style="display: none; color: #94a3b8; margin: 15px 0;">
      <p>Bud plassert! Venter på andre spillere...</p>
    </div>

    <!-- Kort/Spillområde -->
    <div id="play-panel" style="display: none;">
      <div id="turn-badge" class="badge" style="display: none;">Din Tur!</div>
      <div id="my-cards" class="cards-container"></div>
      <h3 id="hand-score">Håndverdi: 0</h3>
      <div id="controls" class="controls" style="display: none;">
        <button class="btn-hit" onclick="hit()">Trekk (Hit)</button>
        <button class="btn-stand" onclick="stand()">Stå (Stand)</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket'] });

    function joinGame() {
      const name = document.getElementById('player-name').value.trim();
      if (name) {
        socket.emit('join_game', { name });
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';
        document.getElementById('display-name').innerText = name;
      }
    }

    function placeBet(amount) {
      socket.emit('place_bet', { amount });
    }

    function hit() { socket.emit('player_hit'); }
    function stand() { socket.emit('player_stand'); }

    socket.on('player_state', (data) => {
      const bettingPanel = document.getElementById('betting-panel');
      const waitingBets = document.getElementById('waiting-bets');
      const playPanel = document.getElementById('play-panel');

      if (data.gameStatus === 'BETTING') {
        playPanel.style.display = 'none';
        if (!data.hasBet) {
          bettingPanel.style.display = 'block';
          waitingBets.style.display = 'none';
        } else {
          bettingPanel.style.display = 'none';
          waitingBets.style.display = 'block';
        }
      } else if (data.gameStatus === 'PLAYING') {
        bettingPanel.style.display = 'none';
        waitingBets.style.display = 'none';
        playPanel.style.display = 'block';

        const cardsContainer = document.getElementById('my-cards');
        cardsContainer.innerHTML = '';
        if (data.hand && data.hand.length > 0) {
          data.hand.forEach(card => {
            const isRed = card.suit === '♥' || card.suit === '♦';
            const cardDiv = document.createElement('div');
            cardDiv.className = `card ${isRed ? 'red' : ''}`;
            cardDiv.innerHTML = `<div>${card.value}</div><div style="text-align:right;">${card.suit}</div>`;
            cardsContainer.appendChild(cardDiv);
          });
        }

        document.getElementById('hand-score').innerText = `Håndverdi: ${data.score || 0}`;

        const turnBadge = document.getElementById('turn-badge');
        const controls = document.getElementById('controls');

        if (data.myTurn) {
          turnBadge.style.display = 'inline-block';
          controls.style.display = 'flex';
        } else {
          turnBadge.style.display = 'none';
          controls.style.display = 'none';
        }
      }
    });
  </script>
</body>
</html>
