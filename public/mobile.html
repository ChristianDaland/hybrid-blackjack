<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Mobil</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .card-panel {
      width: 100%;
      max-width: 360px;
      background-color: #1e293b;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
      font-size: 1.1rem;
      margin-bottom: 16px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-join { background-color: #2563eb; color: white; }
    .btn-bet { background-color: #facc15; color: #000; margin-top: 10px; }
    .btn-hit { background-color: #16a34a; color: white; }
    .btn-stand { background-color: #dc2626; color: white; }
    .chips { color: #4ade80; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
    .cards-container { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
    .card {
      background: white; color: #0f172a; width: 70px; height: 100px;
      border-radius: 8px; display: flex; flex-direction: column;
      justify-content: space-between; padding: 8px; font-weight: bold; font-size: 1.3rem;
    }
    .red { color: #dc2626; }
    .controls { display: flex; gap: 10px; margin-top: 15px; }
  </style>
</head>
<body>

  <!-- Innlogging -->
  <div id="login-view" class="card-panel">
    <h2 style="margin-bottom: 15px;">Bli med i spillet</h2>
    <input type="text" id="player-name" placeholder="Skriv navnet ditt">
    <button class="btn-join" onclick="joinGame()">Bli med</button>
  </div>

  <!-- Budgivning -->
  <div id="bet-view" class="card-panel" style="display: none;">
    <h2>Plasser ditt bud</h2>
    <div id="bet-chips" class="chips">Saldo: 500 kr</div>
    <input type="number" id="bet-amount" value="100" step="50" min="10">
    <button class="btn-bet" onclick="placeBet()">Bekreft Bud</button>
  </div>

  <!-- Spillskjerm -->
  <div id="game-view" class="card-panel" style="display: none;">
    <h2 id="display-name">Spiller</h2>
    <div id="game-chips" class="chips">Saldo: 500 kr</div>
    <p id="my-bet-display" style="color: #facc15;">Bud: 0 kr</p>

    <div id="my-cards" class="cards-container"></div>
    <h3 id="hand-score">Håndverdi: 0</h3>

    <div id="controls" class="controls" style="display: none;">
      <button class="btn-hit" onclick="hit()">Trekk</button>
      <button class="btn-stand" onclick="stand()">Stå</button>
    </div>
  </div>

  <script>
    const socket = io();

    function joinGame() {
      const name = document.getElementById('player-name').value.trim();
      if (name) {
        socket.emit('join_game', { name });
        document.getElementById('display-name').innerText = name;
      }
    }

    function placeBet() {
      const amount = document.getElementById('bet-amount').value;
      socket.emit('place_bet', { amount });
    }

    function hit() { socket.emit('player_hit'); }
    function stand() { socket.emit('player_stand'); }

    socket.on('player_state', (data) => {
      document.getElementById('login-view').style.display = 'none';

      document.getElementById('bet-chips').innerText = `Saldo: ${data.chips} kr`;
      document.getElementById('game-chips').innerText = `Saldo: ${data.chips} kr`;

      // Skjul eller vis budskjerm direkte basert på om spilleren har lagt bud
      if (data.gameStatus === 'BETTING' && !data.hasBet) {
        document.getElementById('bet-view').style.display = 'block';
        document.getElementById('game-view').style.display = 'none';
      } else {
        document.getElementById('bet-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'block';
      }

      document.getElementById('my-bet-display').innerText = `Bud: ${data.bet} kr`;

      const cardsContainer = document.getElementById('my-cards');
      cardsContainer.innerHTML = '';
      if (data.hand && data.hand.length > 0) {
        data.hand.forEach(card => {
          const isRed = card.suit === '♥' || card.suit === '♦';
          const cardDiv = document.createElement('div');
          cardDiv.className = `card ${isRed ? 'red' : ''}`;
          cardDiv.innerHTML = `<div>${card.value}</div><div style="text-align:right;">${card.suit}</div>`;
          cardsContainer.appendChild(cardDiv);
        });
      }

      document.getElementById('hand-score').innerText = `Håndverdi: ${data.score || 0}`;
      document.getElementById('controls').style.display = (data.myTurn && data.gameStatus === 'PLAYING') ? 'flex' : 'none';
    });
  </script>
</body>
</html>
