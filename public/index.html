<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Bord - Løland Gård</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #064e3b; /* Klassisk filt-grønn farge */
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      overflow: hidden;
    }

    /* Toppbar med tittel, URL og QR-kode */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 24px;
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }

    .title-area h1 {
      font-size: 28px;
      color: #fef08a;
      letter-spacing: 1px;
    }

    .qr-container {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 12px;
    }

    #qrcode {
      background: white;
      padding: 4px;
      border-radius: 6px;
    }

    /* Banken / Dealer Område */
    .dealer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .dealer-title {
      font-size: 20px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* Spillernes bord-layout */
    .table-area {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .player-card {
      background: rgba(15, 23, 42, 0.85);
      border: 3px solid #334155;
      border-radius: 16px;
      padding: 16px;
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .player-card.active-turn {
      border-color: #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.6);
      transform: translateY(-8px);
    }

    .player-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .player-score {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    /* Kort-rendering */
    .cards-wrapper {
      display: flex;
      gap: -20px;
      justify-content: center;
      min-height: 110px;
    }

    .card {
      width: 65px;
      height: 95px;
      background: white;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      margin: 0 2px;
    }

    .card.red { color: #dc2626; }
    .card.black { color: #0f172a; }

    .card-hidden {
      background: #1e293b;
      border: 2px solid #38bdf8;
      color: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* Vinner / Resultat Banner */
    #results-modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #facc15;
      padding: 30px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      z-index: 100;
      max-width: 80%;
    }

    #results-modal h2 {
      color: #facc15;
      font-size: 32px;
      margin-bottom: 16px;
    }

    #results-list {
      list-style: none;
      font-size: 20px;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    /* Bilde-kontroller nederst */
    footer {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.96); }
    .btn-primary { background: #2563eb; color: white; }
    .btn-secondary { background: #475569; color: white; }
  </style>
</head>
<body>

  <!-- Toppbar med oppkoblingsinfo -->
  <header>
    <div class="title-area">
      <h1>BLACKJACK</h1>
      <p style="color: #a7f3d0; font-size: 14px;">Bordskjerm (Banken)</p>
    </div>
    <div class="qr-container">
      <div>
        <p style="font-size: 12px; color: #94a3b8;">SKANN FOR Å BLI MED:</p>
        <p id="server-url" style="font-weight: bold; font-size: 14px;"></p>
      </div>
      <div id="qrcode"></div>
    </div>
  </header>

  <!-- Banken (Dealer) -->
  <div class="dealer-section">
    <div class="dealer-title">BANKEN (DEALER) — POENG: <span id="dealer-score">0</span></div>
    <div id="dealer-cards" class="cards-wrapper">
      <div class="card card-hidden">?</div>
    </div>
  </div>

  <!-- Spillere ved bordet -->
  <div id="players-table" class="table-area">
    <!-- Genereres dynamisk via JavaScript -->
  </div>

  <!-- Resultatvisning (Showdown) -->
  <div id="results-modal">
    <h2>RUNDEN ER FULLFØRT</h2>
    <ul id="results-list"></ul>
    <button class="btn btn-primary" onclick="startNewHand()">Neste Hånd</button>
  </div>

  <!-- Kontrollknapper -->
  <footer>
    <button class="btn btn-primary" onclick="startNewHand()">Start Ny Hånd</button>
    <button class="btn btn-secondary" onclick="resetGame()">Nullstill Bord</button>
  </footer>

  <script>
    const socket = io();

    // Vis gjeldende URL og generer QR-kode
    const currentUrl = window.location.origin + '/mobile.html';
    document.getElementById('server-url').innerText = window.location.host;
    new QRCode(document.getElementById("qrcode"), {
      text: currentUrl,
      width: 64,
      height: 64
    });

    // Mottak av oppdatert tilstand fra server.js
    socket.on('state_update', (state) => {
      renderDealer(state.dealerHand, state.dealerScore);
      renderPlayers(state.players, state.currentTurnPlayerId);
      renderResults(state.winnerInfo);
    });

    // Tegn bankens (dealerens) kort og poengsum
    function renderDealer(hand, score) {
      document.getElementById('dealer-score').innerText = score;
      const dealerContainer = document.getElementById('dealer-cards');

      if (!hand || hand.length === 0) {
        dealerContainer.innerHTML = '<div class="card card-hidden">?</div>';
        return;
      }

      dealerContainer.innerHTML = hand.map(card => {
        if (card.value === '?') {
          return '<div class="card card-hidden">?</div>';
        }
        const isRed = card.suit === '♥' || card.suit === '♦';
        return `
          <div class="card ${isRed ? 'red' : 'black'}">
            <div>${card.value}</div>
            <div style="text-align: center; font-size: 20px;">${card.suit}</div>
            <div style="text-align: right;">${card.value}</div>
          </div>
        `;
      }).join('');
    }

    // Tegn alle spillere rundt bordet
    function renderPlayers(players, activePlayerId) {
      const tableContainer = document.getElementById('players-table');

      if (players.length === 0) {
        tableContainer.innerHTML = '<p style="font-size: 20px; color: #a7f3d0;">Venter på at spillere skal koble til via mobilen...</p>';
        return;
      }

      tableContainer.innerHTML = players.map(p => {
        const isActive = p.id === activePlayerId;
        return `
          <div class="player-card ${isActive ? 'active-turn' : ''}">
            <div class="player-name">${p.name}</div>
            <div class="player-score">Poeng: ${p.score} ${p.status === 'BUST' ? ' (SPRAKK)' : ''}</div>
            <div class="cards-wrapper">
              ${p.hand.map(card => {
                const isRed = card.suit === '♥' || card.suit === '♦';
                return `
                  <div class="card ${isRed ? 'red' : 'black'}">
                    <div>${card.value}</div>
                    <div style="text-align: center; font-size: 18px;">${card.suit}</div>
                    <div style="text-align: right;">${card.value}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // Vis modal med vinnere/resultater
    function renderResults(winnerInfo) {
      const modal = document.getElementById('results-modal');
      const list = document.getElementById('results-list');

      if (winnerInfo && winnerInfo.results) {
        list.innerHTML = winnerInfo.results.map(res => `<li>${res}</li>`).join('');
        modal.style.display = 'block';
      } else {
        modal.style.display = 'none';
      }
    }

    // Start ny hånd
    function startNewHand() {
      socket.emit('start_new_hand');
    }

    // Nullstill spill
    function resetGame() {
      socket.emit('reset_game');
    }
  </script>
</body>
</html>
